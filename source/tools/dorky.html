      --color-success: #22C55E;
      --radius: 6px;

    body {

      line-height: 1.5;

      font-weight: 500;

      border-radius: var(--radius);
      color: var(--color-text-primary);
      transition: all 0.15s ease;
      margin-bottom: 16px;
    }

    input:last-child {
      margin-bottom: 0;
    }

    input:focus {
      outline: none;
      border-color: var(--color-accent);
      background: var(--color-surface);
    }

    input::placeholder {
      color: var(--color-text-tertiary);

      flex-wrap: wrap;

      font-weight: 500;
      font-family: inherit;
      background: var(--color-accent);
      color: var(--color-surface);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;

    }

    }

    button.secondary:hover i {

    }

      border-radius: var(--radius);

      overflow: hidden;

      cursor: pointer;
      transition: background 0.15s ease;

    .cat-header:hover {

    }

    .cat-title-wrapper {

    .cat-icon {

    .cat-title {

          '"port:102"',
          '"port:47808"',
          '"port:44818"',
          '"port:2404 asdu address"',
          '"DICOM Server Response" port:104',
          '"Server: Prismview Player"',
        ],
      },
    ];

    function scopeTemplate(template, target, company) {
      const filled = fillPlaceholders(template, target, company);
      const companyTerm = company ? `intext:"${company}" ` : "";
      return filled
        .split("|")
        .map((part) => `site:${target} ${companyTerm}${part.trim()}`)
        .join(" | ");
    }

    function buildQueriesForTemplate(template, target, company, external = false, engine = "google") {
      if (engine === "shodan") {
        return [fillPlaceholders(template, target, company)];
      }
      const hasSite = /(^|\s)site:/.test(template);
      const base = hasSite
        ? fillPlaceholders(template, target, company)
        : scopeTemplate(template, target, "");
      const queries = [base];
      if (company && !external && !hasSite) {
        queries.push(scopeTemplate(template, target, company));
      }
      return queries;
    }

    function sanitize(value) {
      return value.trim().replace(/["'|]/g, "");
    }

    function generateDorks() {
      const target = sanitize(document.getElementById("target").value);
      const company = sanitize(document.getElementById("company").value);
      if (!target) {
        alert("Please enter a domain.");
        return;
      }

      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      dorkTemplates.forEach((group) => {
        const catDiv = document.createElement("div");
        catDiv.className = "category";

        const header = document.createElement("div");
        header.className = "cat-header";

        const titleWrapper = document.createElement("div");
        titleWrapper.className = "cat-title-wrapper";
        titleWrapper.onclick = () => ulWrap.classList.toggle("show");

        const iconElement = document.createElement("i");
        iconElement.className = `fas ${group.icon} cat-icon`;

        const h2 = document.createElement("h2");
        h2.className = "cat-title";
        h2.textContent = group.category;

        titleWrapper.appendChild(iconElement);
        titleWrapper.appendChild(h2);

        const headerActions = document.createElement("div");
        headerActions.className = "cat-actions";

        const copyCatBtn = document.createElement("button");
        copyCatBtn.className = "icon-btn";
        copyCatBtn.title = "Copy all in category";
        copyCatBtn.innerHTML = '<i class="fas fa-copy"></i>';
        copyCatBtn.onclick = (e) => {
          e.stopPropagation();
          const allQs = [];
          group.dorks.forEach((tpl) => {
            buildQueriesForTemplate(tpl, target, company, group.external, group.engine).forEach((q) => allQs.push(q));
          });
          navigator.clipboard.writeText(allQs.join("\n"));
          alert(`Copied ${allQs.length} queries from "${group.category}"`);
        };

        const toggleBtn = document.createElement("button");
        toggleBtn.className = "icon-btn";
        toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
        toggleBtn.onclick = (e) => {
          e.stopPropagation();
          ulWrap.classList.toggle("show");
        };

        headerActions.appendChild(copyCatBtn);
        headerActions.appendChild(toggleBtn);

        header.appendChild(titleWrapper);
        header.appendChild(headerActions);

        const ulWrap = document.createElement("div");
        ulWrap.className = "dorks";
        const ul = document.createElement("ul");

        group.dorks.forEach((template) => {
          const queries = buildQueriesForTemplate(template, target, company, group.external, group.engine);
          queries.forEach((q) => {
            const link = document.createElement("a");
            const searchUrl = group.engine === "shodan"
              ? `https://www.shodan.io/search?query=${encodeURIComponent(q)}`
              : `https://www.google.com/search?q=${encodeURIComponent(q)}`;
            link.href = searchUrl;
            link.textContent = q;
            link.target = "_blank";

            const copyBtn = document.createElement("button");
            copyBtn.textContent = "Copy";
            copyBtn.className = "copy-btn";
            copyBtn.onclick = () => navigator.clipboard.writeText(q);

            const li = document.createElement("li");
            li.appendChild(link);
            li.appendChild(copyBtn);
            ul.appendChild(li);
          });
        });

        ulWrap.appendChild(ul);
        catDiv.appendChild(header);
        catDiv.appendChild(ulWrap);
        resultsDiv.appendChild(catDiv);
      });
    }

    function expandAll() {
      document.querySelectorAll(".dorks").forEach((el) => el.classList.add("show"));
    }

    function collapseAll() {
      document.querySelectorAll(".dorks").forEach((el) => el.classList.remove("show"));
    }

    function copyAll() {
      const target = sanitize(document.getElementById("target").value);
      const company = sanitize(document.getElementById("company").value);
      if (!target) {
        alert("Please enter a domain first.");
        return;
      }
      const queries = [];
      dorkTemplates.forEach((group) => {
        group.dorks.forEach((template) => {
          buildQueriesForTemplate(template, target, company, group.external, group.engine).forEach((q) => queries.push(q));
        });
      });
      navigator.clipboard.writeText(queries.join("\n"));
      alert(`Copied ${queries.length} queries to clipboard.`);
    }
  </script>
</body>
